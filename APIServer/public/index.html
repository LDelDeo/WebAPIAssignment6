<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player List</title>
    <link rel ="stylesheet" href="styles.css">
</head>
<body>
    <h1>Mini John</h1>
    <h2>Player List</h2>
    <ul id="playerList"></ul>

    <script>
        async function fetchPlayers() {
            try {
                const response = await fetch("http://localhost:3000/player"); // Adjust if running on a different port
                const data = await response.json();

                const playerList = document.getElementById("playerList");
                playerList.innerHTML = ""; // Clear previous entries
                
                data.players.forEach(player => {
                    const li = document.createElement("li");
                    li.innerHTML = 
                        li.textContent = `${player.screenName} || ${player.firstName} ${player.lastName} || Games Played: ${player.gamesPlayed} || Score: ${player.score} || (ID: ${player.playerid}) 
                        <button onclick="updatePlayer('${player.playerid}')">Update</button>
                        <button onclick="deletePlayer('${player.playerid}')">Delete</button>
                    `;
                    playerList.appendChild(li);
                });
            } catch (error) {
                console.error("Error fetching players:", error);
            }
        }

        async function deletePlayer(playerId) {
            if (confirm("Are you sure you want to delete this player?")) {
                try {
                    const response = await fetch(`http://localhost:3000/player/${playerId}`, { 
                        method: "DELETE" 
                    });

                    if (response.ok) {
                        alert("Player deleted successfully.");
                        fetchPlayers(); // Refresh the list
                    } else {
                        alert("Failed to delete player.");
                    }
                } catch (error) {
                    console.error("Error deleting player:", error);
                }
            }
        }

        async function updatePlayer(playerId) {
            try {
                // Fetch the existing player data
                const response = await fetch(`http://localhost:3000/player/${playerId}`);
                const player = await response.json();

                if (!player) {
                    alert("Player not found.");
                    return;
                }

                // Ask the user for new values (keep old values if not changed)
                const newFirstName = prompt("Enter new first name:", player.firstName);
                const newLastName = prompt("Enter new last name:", player.lastName);
                const newScreenName = prompt("Enter new screen name:", player.screenName);

                // Keep other properties unchanged and send only updated values
                const updatedPlayer = {
                    playerid: playerId,
                    firstName: newFirstName,
                    lastName: newLastName,
                    screenName: newScreenName
                };

                // Send updated data to the server
                const updateResponse = await fetch("http://localhost:3000/onlineUpdatePlayer", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updatedPlayer)
                });

                if (updateResponse.ok) {
                    alert("Player updated successfully.");
                    fetchPlayers();
                } else {
                    alert("Failed to update player.");
                }
            } catch (error) {
                console.error("Error updating player:", error);
            }
        }
        
        fetchPlayers(); // Call function to fetch and display players
    </script>

    <a href="topten.html"><button>View Top 10 Players</button></a>

</body>
</html>
